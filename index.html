<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>PDF наклейки с размерами ячеек</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
      #canvasWrapper {
          max-height: 70vh;
          overflow-y: auto;
          border: 1px solid #dee2e6;
          margin-top: 20px;
      }
      #pdfCanvas {
          display: block;
          width: 100%;
          height: auto;
      }
  </style>
</head>
<body>

<div class="container py-4">
  <h2 class="mb-4 text-center">Создание PDF с наклейками</h2>

  <form id="stickerForm" class="row g-3">
    <div class="col-12">
      <label for="fileInput" class="form-label">Выберите PDF файл</label>
      <input class="form-control" type="file" id="fileInput" accept="application/pdf" />
    </div>

    <div class="col-6 col-md-3">
      <label for="cellWidthMm" class="form-label">Ширина ячейки (мм)</label>
      <input type="number" class="form-control" id="cellWidthMm" min="10" value="50" />
    </div>

    <div class="col-6 col-md-3">
      <label for="cellHeightMm" class="form-label">Высота ячейки (мм)</label>
      <input type="number" class="form-control" id="cellHeightMm" min="10" value="30" />
    </div>

    <div class="col-6 col-md-3">
      <label for="stickersPerRow" class="form-label">Наклеек в ряду</label>
      <input type="number" class="form-control" id="stickersPerRow" min="1" max="20" value="2" />
    </div>

    <div class="col-6 col-md-3">
      <label for="rowsCount" class="form-label">Количество строк</label>
      <input type="number" class="form-control" id="rowsCount" min="1" max="20" value="8" />
    </div>

    <div class="col-6 col-md-3">
      <label for="topGapMm" class="form-label">Отступ сверху (мм)</label>
      <input type="number" class="form-control" id="topGapMm" min="0" value="2" />
    </div>

    <div class="col-12">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="showBorders" checked>
        <label class="form-check-label" for="showBorders">
          Показывать рамки вокруг ячеек
        </label>
      </div>
    </div>

    <div class="col-12 d-flex justify-content-center gap-3 mt-3">
      <button type="button" id="btnProcess" class="btn btn-primary px-4">Создать PDF</button>
      <button type="button" id="btnPrint" class="btn btn-success px-4" disabled>Напечатать PDF</button>
    </div>
  </form>

  <div id="canvasWrapper">
    <canvas id="pdfCanvas"></canvas>
  </div>
</div>

<script>
  const { PDFDocument, rgb } = PDFLib;
  const MM_TO_PT = 2.83464567;
  const PT_TO_MM = 1 / MM_TO_PT;
  const A4_WIDTH = 595.28;
  const A4_HEIGHT = 841.89;
  let pdfBytesGlobal = null;
  let topGap = 2; // значение по умолчанию

  document.addEventListener("DOMContentLoaded", () => {
    const fileInput = document.getElementById('fileInput');

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFDocument.load(arrayBuffer);
        const firstPage = pdfDoc.getPage(0);

        const widthMm = (firstPage.getWidth() * PT_TO_MM).toFixed(2);
        const heightMm = (firstPage.getHeight() * PT_TO_MM).toFixed(2);

        document.getElementById('cellWidthMm').value = widthMm;
        document.getElementById('cellHeightMm').value = heightMm;
      } catch (e) {
        console.error('Ошибка при чтении PDF:', e);
      }
    });

    document.getElementById('btnProcess').onclick = async () => {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return alert('Выберите PDF файл');

      const cellWidthPt = parseFloat(document.getElementById('cellWidthMm').value) * MM_TO_PT;
      const cellHeightPt = parseFloat(document.getElementById('cellHeightMm').value) * MM_TO_PT;
      const stickersPerRow = parseInt(document.getElementById('stickersPerRow').value);
      const rowsCount = parseInt(document.getElementById('rowsCount').value);
      const showBorders = document.getElementById('showBorders').checked;
      topGap = parseFloat(document.getElementById('topGapMm').value) * MM_TO_PT;

      const arrayBuffer = await file.arrayBuffer();
      const sourcePdf = await PDFDocument.load(arrayBuffer);
      const newPdf = await PDFDocument.create();

      const firstPage = sourcePdf.getPage(0);
      const [ embeddedPage ] = await newPdf.embedPages([ firstPage ]);

      const origWidth = embeddedPage.width;
      const origHeight = embeddedPage.height;

      const newPage = newPdf.addPage([ A4_WIDTH, A4_HEIGHT ]);

      const blockWidth = stickersPerRow * cellWidthPt;
      const blockHeight = rowsCount * cellHeightPt;

      const startX = (A4_WIDTH - blockWidth) / 2;
      const startY = (A4_HEIGHT - blockHeight) - topGap;

      for (let row = 0; row < rowsCount; row++) {
        for (let col = 0; col < stickersPerRow; col++) {
          const x = startX + col * cellWidthPt;
          const y = startY + (rowsCount - 1 - row) * cellHeightPt;

          const scaleX = cellWidthPt / origWidth;
          const scaleY = cellHeightPt / origHeight;
          const scale = Math.min(scaleX, scaleY);

          const drawWidth = origWidth * scale;
          const drawHeight = origHeight * scale;

          const offsetX = x + (cellWidthPt - drawWidth) / 2;
          const offsetY = y + (cellHeightPt - drawHeight) / 2;

          newPage.drawPage(embeddedPage, {
            x: offsetX,
            y: offsetY,
            width: drawWidth,
            height: drawHeight
          });

          if (showBorders) {
            newPage.drawRectangle({
              x: x,
              y: y,
              width: cellWidthPt,
              height: cellHeightPt,
              borderColor: rgb(0, 0, 0),
              borderWidth: 0.5,
            });
          }
        }
      }

      const pdfBytes = await newPdf.save();
      pdfBytesGlobal = pdfBytes;

      renderPDF(pdfBytes);

      const blob = new Blob([ pdfBytes ], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const printBtn = document.getElementById('btnPrint');
      printBtn.disabled = false;
      printBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'stickers.pdf';
        a.click();
      };
    };

    async function renderPDF(pdfBytes) {
      const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
      const pdf = await loadingTask.promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1.5 });

      const canvas = document.getElementById('pdfCanvas');
      const context = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      const renderContext = {
        canvasContext: context,
        viewport: viewport
      };

      await page.render(renderContext).promise;
    }
  });
</script>

<!-- Bootstrap 5 JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
